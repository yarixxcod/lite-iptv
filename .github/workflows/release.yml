name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-37.2" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "mode=release-keystore" >> "$GITHUB_OUTPUT"
          else
            echo "Release secrets missing; signing with the debug keystore so the build still publishes an installable APK."
            echo "mode=debug-fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$src" "$RUNNER_TEMP/VvvionIPTV.apk"
          cp "$src" "$RUNNER_TEMP/VvvionIPTV-${name}.apk"
          printf '%s\n' "{\"versionCode\": ${code}, \"versionName\": \"${name}\", \"apkUrl\": \"https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/VvvionIPTV.apk\", \"notes\": \"Vvvion IPTV ${name}\"}" > "$RUNNER_TEMP/latest.json"
          echo "stable=$RUNNER_TEMP/VvvionIPTV.apk" >> "$GITHUB_OUTPUT"
          echo "versioned=$RUNNER_TEMP/VvvionIPTV-${name}.apk" >> "$GITHUB_OUTPUT"
          echo "manifest=$RUNNER_TEMP/latest.json" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "version=${name}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Vvvion IPTV ${{ steps.apk.outputs.version }}
          body: |
            versionCode: ${{ steps.apk.outputs.code }}
          files: |
            ${{ steps.apk.outputs.stable }}
            ${{ steps.apk.outputs.versioned }}
            ${{ steps.apk.outputs.manifest }}
          fail_on_unmatched_files: true
