name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-37.2" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, debug APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LiteIPTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
