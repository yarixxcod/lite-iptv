org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 enables a new DSL and built-in Kotlin by default. Keep the classic
# application DSL so Kotlin, KSP and Compose stay explicitly versioned.
android.builtInKotlin=false
android.newDsl=false
kotlin.daemon.jvmargs=-Xmx1024m
android.nonFinalResIds=true
